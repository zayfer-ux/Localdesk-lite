<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LocalDesk</title>
    <style>
        /* Reseteo y Tipografía HIG de Apple */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Fondo premium: Degradado profundo estilo wallpaper de macOS (Negro/Azul) */
            background: radial-gradient(circle at top right, #003366, #000000 65%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor central (White Card) */
        .login-card {
            background-color: #FFFFFF;
            width: 90%;
            max-width: 420px;
            border-radius: 24px;
            /* Esquinas redondeadas tipo iOS */
            padding: 48px 40px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        /* Logo SVG (Adaptado al Login) */
        .login-logo {
            color: #1D1D1F;
            /* Negro profundo de Apple */
            margin-bottom: 20px;
        }

        /* Títulos */
        h2 {
            color: #1D1D1F;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p {
            color: #86868B;
            /* Gris secundario Apple */
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        /* Entradas de texto (Inputs) */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .apple-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1D1D1F;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .apple-input {
            width: 100%;
            background-color: #F5F5F7;
            /* Gris claro para el fondo del input */
            border: 1px solid transparent;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 1rem;
            color: #1D1D1F;
            transition: all 0.2s ease;
        }

        .apple-input:focus {
            outline: none;
            background-color: #FFFFFF;
            border-color: #0071E3;
            /* Azul Apple */
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.2);
            /* Resplandor azul de focus */
        }

        /* Botón de Acción */
        .btn-apple {
            width: 100%;
            background-color: #0071E3;
            /* Azul Apple Oficial */
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 980px;
            /* Estilo píldora */
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
        }

        .btn-apple:hover {
            background-color: #005BB5;
            transform: scale(0.98);
        }

        /* Alertas de error elegantes */
        .alert-danger {
            background-color: rgba(255, 59, 48, 0.1);
            color: #FF3B30;
            /* Rojo Apple */
            border-radius: 12px;
            padding: 12px;
            font-size: 0.9rem;
            margin-bottom: 24px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <!-- Logo de LocalDesk Vectorizado -->
        <div class="login-logo">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 5v14h7 M5 19l7-7v-7 M12 5q8 0 8 7t-8 7" />
                <circle cx="5" cy="5" r="2.5" fill="#FFFFFF" />
                <circle cx="5" cy="19" r="2.5" fill="#FFFFFF" />
                <circle cx="12" cy="12" r="2.5" fill="#FFFFFF" />
                <circle cx="12" cy="5" r="2.5" fill="#FFFFFF" />
                <circle cx="12" cy="19" r="2.5" fill="#FFFFFF" />
                <circle cx="20" cy="12" r="2.5" fill="#FFFFFF" />
            </svg>
        </div>

        <h2>LocalDesk</h2>
        <p>Inicia sesión con tu cuenta de administrador</p>

        <!-- Mensajes de error interactivos (Jinja2 Intacto) -->
        {% with messages = get_flashed_messages(category_filter=["danger"]) %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert-danger">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- Formulario (Lógica Python intacta) -->
        <form method="POST" action="/login">
            <div class="form-group">
                <label class="apple-label">Usuario</label>
                <input type="text" name="usuario" class="apple-input" placeholder="admin" required>
            </div>

            <div class="form-group">
                <label class="apple-label">Contraseña</label>
                <input type="password" name="password" class="apple-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-apple">Continuar</button>
        </form>
    </div>

</body>

</html>
