<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LocalDesk Lite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Centrado de pantalla completa específico para el login */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, var(--purple-dark), var(--bg-dark) 40%);
        }
    </style>
</head>

<body>
    <div class="card card-futuristic p-5" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h3 style="color: var(--purple-light); font-weight: 800; letter-spacing: 1px;">LOCALDESK</h3>
            <p class="text-muted">Acceso de Seguridad</p>
        </div>

        <!-- Mostrar mensajes de error si las credenciales fallan -->
        {% with messages = get_flashed_messages(category_filter=["danger"]) %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger bg-transparent border-danger text-danger text-center">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label" style="color: var(--purple-light);">Identificador</label>
                <input type="text" name="usuario" class="form-control form-control-dark"
                    placeholder="Ingresa tu usuario" required>
            </div>
            <div class="mb-4">
                <label class="form-label" style="color: var(--purple-light);">Código de acceso</label>
                <input type="password" name="password" class="form-control form-control-dark" placeholder="••••••••"
                    required>
            </div>
            <button type="submit" class="btn w-100 btn-neon py-2">INICIAR SESIÓN</button>
        </form>
    </div>
</body>

</html>
