<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - LocalDesk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body
    style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: var(--apple-bg);">
    <div class="apple-card" style="width: 360px;">
        <h2 style="text-align: center; margin-bottom: 24px; font-weight: 700;">LocalDesk</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div
            style="background-color: rgba(255,59,48,0.1); color: var(--apple-red); padding: 12px; border-radius: 8px; margin-bottom: 16px; text-align: center; font-size: 0.9rem;">
            {{ messages[0] }}
        </div>
        {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <label class="apple-label">Correo Electrónico</label>
            <input type="email" name="email" class="apple-input" placeholder="ejemplo@empresa.com" required
                style="width: 100%; margin-bottom: 16px;">

            <label class="apple-label">Contraseña</label>
            <input type="password" name="password" class="apple-input" required
                style="width: 100%; margin-bottom: 24px;">

            <button type="submit" class="btn-apple" style="width: 100%; margin-bottom: 16px;">Iniciar Sesión</button>
        </form>

        <p style="text-align: center; font-size: 0.9rem; margin-top: 16px;">
            ¿No tienes cuenta? <a href="/registro"
                style="color: var(--apple-blue); text-decoration: none; font-weight: 600;">Regístrate aquí</a>
        </p>
    </div>
</body>

</html>
