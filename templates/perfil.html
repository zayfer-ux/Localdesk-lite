{% extends "base.html" %}

{% block content %}
<div class="d-flex-between mb-4">
    <div>
        <h1 style="font-size: 2rem; font-weight: 700; letter-spacing: -1px;">Mi Perfil</h1>
        <p style="color: var(--apple-text-secondary); margin-top: 4px;">Configuración de tu cuenta y datos personales
        </p>
    </div>
</div>

<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px;">
    <!-- TARJETA DE INFORMACIÓN -->
    <div class="apple-card" style="text-align: center; height: fit-content;">
        <img src="{{ perfil[5] or 'https://ui-avatars.com/api/?name=' + perfil[0] + '&background=0071E3&color=fff&size=150' }}"
            style="width: 120px; height: 120px; border-radius: 50%; margin-bottom: 16px; object-fit: cover; border: 4px solid var(--apple-surface); box-shadow: var(--shadow-soft);">
        <h2 style="font-size: 1.4rem; font-weight: 600;">{{ perfil[0] }}</h2>
        <p style="color: var(--apple-text-secondary); margin-bottom: 16px;">@{{ perfil[1] }}</p>
        <span class="badge badge-blue" style="font-size: 0.9rem;">{{ perfil[3] }}</span>
    </div>

    <!-- FORMULARIO DE ACTUALIZACIÓN -->
    <div class="apple-card">
        <h3 style="font-size: 1.2rem; font-weight: 600; margin-bottom: 20px;">Datos de Contacto</h3>
        <form action="/perfil" method="POST">
            <label class="apple-label">Correo Electrónico (Solo lectura)</label>
            <input type="email" class="apple-input" value="{{ perfil[2] }}" disabled
                style="margin-bottom: 16px; width: 100%; background-color: #F5F5F7;">

            <label class="apple-label">Número de Teléfono</label>
            <input type="text" name="telefono" class="apple-input" value="{{ perfil[4] or '' }}"
                placeholder="Ej. 555-1234" style="margin-bottom: 16px; width: 100%;">

            <label class="apple-label">URL de Foto de Perfil (Opcional)</label>
            <input type="url" name="foto" class="apple-input" value="{{ perfil[5] or '' }}"
                placeholder="Pega un enlace de imagen (http...)" style="margin-bottom: 24px; width: 100%;">

            <button type="submit" class="btn-apple"><i class="fa-solid fa-floppy-disk" style="margin-right: 8px;"></i>
                Guardar Cambios</button>
        </form>
    </div>
</div>
{% endblock %}
