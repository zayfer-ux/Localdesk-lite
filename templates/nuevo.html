{% extends "base.html" %}

{% block content %}
<div class="d-flex-between mb-4">
    <div>
        <h1 style="font-size: 2rem; font-weight: 700; letter-spacing: -1px; margin: 0; color: var(--apple-text-main);">
            Nuevo Ticket</h1>
        <p style="color: var(--apple-text-secondary); margin-top: 4px;">Reportar una nueva incidencia en la organización
        </p>
    </div>
    <a href="/" class="btn-apple btn-apple-secondary" style="display: flex; align-items: center; gap: 8px;">
        <i class="fa-solid fa-arrow-left"></i> Volver al Dashboard
    </a>
</div>

<div class="apple-card" style="max-width: 800px; margin: 0 auto; padding: 40px;">
    <form action="/nuevo" method="POST">
        <div style="margin-bottom: 24px;">
            <label
                style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--apple-text-main); margin-bottom: 8px;">Título
                del problema</label>
            <input type="text" name="titulo" class="apple-input"
                placeholder="Ej: Falla en la conexión Wi-Fi de la sala de juntas" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;">
            <div>
                <label
                    style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--apple-text-main); margin-bottom: 8px;">Activo
                    / Ubicación</label>
                <input type="text" name="activo_ubicacion" class="apple-input"
                    placeholder="Ej: Impresora 01, Sala B, Laptop LENOVO-22" required>
            </div>
            <div>
                <label
                    style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--apple-text-main); margin-bottom: 8px;">Prioridad</label>
                <select name="prioridad" class="apple-input">
                    <option value="Baja">Baja (No afecta operación)</option>
                    <option value="Media" selected>Media (Afecta parcialmente)</option>
                    <option value="Alta">Alta (Operación detenida)</option>
                    <option value="Urgente">Urgente (Crítico para el negocio)</option>
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;">
            <div>
                <label
                    style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--apple-text-main); margin-bottom: 8px;">Departamento
                    / Área</label>
                <select name="area_id" class="apple-input" required>
                    <option value="" disabled selected>Selecciona el área...</option>
                    {% for area in areas %}
                    <option value="{{ area[0] }}">{{ area[1] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label
                    style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--apple-text-main); margin-bottom: 8px;">Categoría
                    del problema</label>
                <select name="categoria_id" class="apple-input" required>
                    <option value="" disabled selected>Selecciona una categoría...</option>
                    {% for cat in categorias %}
                    <option value="{{ cat[0] }}">{{ cat[1] }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div style="margin-bottom: 32px;">
            <label
                style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--apple-text-main); margin-bottom: 8px;">Descripción
                detallada</label>
            <textarea name="descripcion" class="apple-input" rows="6"
                placeholder="Describe los síntomas, qué estabas haciendo y cualquier error en pantalla..." required
                style="resize: vertical;"></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end;">
            <button type="submit" class="btn-apple"
                style="background-color: #0071E3; color: white; border: none; padding: 12px 24px; font-size: 1rem;">
                <i class="fa-solid fa-paper-plane"></i> Enviar Ticket
            </button>
        </div>
    </form>
</div>
{% endblock %}
