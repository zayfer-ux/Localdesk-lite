{% extends "base.html" %}

{% block content %}
<div class="d-flex-between mb-4">
    <h1 style="font-size: 2rem; font-weight: 700; letter-spacing: -1px;">Nueva Incidencia</h1>
    <a href="/" class="btn-apple btn-apple-secondary">Cancelar</a>
</div>

<div class="apple-card" style="max-width: 800px; padding: 40px;">
    <form action="/nuevo" method="POST">

        <div class="form-grid-2">
            <div>
                <label class="apple-label">Título del problema</label>
                <input type="text" name="titulo" class="apple-input" placeholder="Ej: Fallo en red Wi-Fi" required>
            </div>
            <div>
                <label class="apple-label">Identificador del Equipo</label>
                <input type="text" name="equipo" class="apple-input" placeholder="Ej: MAC-ADMIN-01" required>
            </div>
        </div>

        <div class="form-grid-3">
            <div>
                <label class="apple-label">Departamento</label>
                <input type="text" name="area" class="apple-input" placeholder="Ej: Diseño" required>
            </div>
            <div>
                <label class="apple-label">Categoría</label>
                <select name="categoria" class="apple-input">
                    <option value="Hardware">Hardware</option>
                    <option value="Software">Software</option>
                    <option value="Red">Red</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <div>
                <label class="apple-label">Prioridad</label>
                <select name="prioridad" class="apple-input">
                    <option value="Baja">Baja</option>
                    <option value="Media" selected>Media</option>
                    <option value="Alta">Alta</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
            <label class="apple-label">Descripción detallada</label>
            <textarea name="descripcion" class="apple-input" rows="4" placeholder="Describe los síntomas en detalle..."
                required></textarea>
        </div>

        <div class="mb-4">
            <label class="apple-label">Reportado por</label>
            <input type="text" name="reportado_por" class="apple-input" placeholder="Nombre completo" required>
        </div>

        <div style="text-align: right; margin-top: 30px;">
            <button type="submit" class="btn-apple" style="padding: 12px 30px;">Crear Incidencia</button>
        </div>
    </form>
</div>
{% endblock %}
