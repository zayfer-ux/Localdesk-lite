<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalDesk</title>
    <!-- Solo FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="layout-wrapper">
        <!-- Sidebar Finder Style (Glassmorphism) -->
        <nav class="sidebar">
            <div class="sidebar-logo">LocalDesk</div>

            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                <i class="fa-solid fa-layer-group"></i> Dashboard
            </a>
            <a href="/nuevo" class="nav-link {% if request.path == '/nuevo' %}active{% endif %}">
                <i class="fa-solid fa-square-plus"></i> Nueva Incidencia
            </a>

            <div style="margin-top: auto;">
                <a href="/logout" class="nav-link nav-link-danger">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión
                </a>
            </div>
        </nav>

        <!-- Dynamic Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
