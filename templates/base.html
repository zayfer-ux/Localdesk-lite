<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalDesk - Dashboard Administrativo</title>
    <!-- Se mantiene Bootstrap SOLO para usar su sistema de grillas (col, row) fácilmente -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- SCRIPT INLINE: Previene FOUC leyendo localStorage antes de pintar el body -->
    <script>
        if (localStorage.getItem('localdesk_sidebar_collapsed') === 'true') {
            document.documentElement.classList.add('sidebar-is-collapsed');
        }
    </script>
</head>

<body>
    <div class="layout-wrapper">
        <!-- MENÚ LATERAL -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">LOCALDESK</span>
                <button class="btn-toggle-sidebar" id="toggleSidebarBtn">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>

            <a href="/" class="nav-link-custom {% if request.path == '/' %}active{% endif %}">
                <i class="fa-solid fa-border-all"></i>
                <span class="nav-text">Dashboard</span>
            </a>
            <a href="/nuevo" class="nav-link-custom {% if request.path == '/nuevo' %}active{% endif %}">
                <i class="fa-solid fa-plus"></i>
                <span class="nav-text">Nueva Incidencia</span>
            </a>

            <div style="margin-top: auto;">
                <a href="/logout" class="nav-link-custom text-danger">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="nav-text">Cerrar Sesión</span>
                </a>
            </div>
        </nav>

        <!-- CONTENIDO DINÁMICO -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Script para funcionalidad del Toggle Sidebar -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleSidebarBtn');

        // Aplicar estado inicial
        if (document.documentElement.classList.contains('sidebar-is-collapsed')) {
            sidebar.classList.add('collapsed');
        }

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            const isCollapsed = sidebar.classList.contains('collapsed');
            localStorage.setItem('localdesk_sidebar_collapsed', isCollapsed);
        });
    </script>
</body>

</html>
