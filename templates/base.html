<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalDesk</title>
    <!-- Solo FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="layout-wrapper">
        <!-- Sidebar Finder Style (Glassmorphism) -->
        <nav class="sidebar">

            <!-- LOGO NATIVO SVG + TEXTO -->
            <a href="/" class="sidebar-logo">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <!-- Conexiones (Líneas de la red) -->
                    <path d="M5 5v14h7 M5 19l7-7v-7 M12 5q8 0 8 7t-8 7" />
                    <!-- Nodos (Círculos) -->
                    <circle cx="5" cy="5" r="2.5" fill="#FFFFFF" />
                    <circle cx="5" cy="19" r="2.5" fill="#FFFFFF" />
                    <circle cx="12" cy="12" r="2.5" fill="#FFFFFF" />
                    <circle cx="12" cy="5" r="2.5" fill="#FFFFFF" />
                    <circle cx="12" cy="19" r="2.5" fill="#FFFFFF" />
                    <circle cx="20" cy="12" r="2.5" fill="#FFFFFF" />
                </svg>
                LocalDesk
            </a>

            <!-- ENLACES DE NAVEGACIÓN -->
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                <i class="fa-solid fa-layer-group"></i> Dashboard
            </a>
            <a href="/nuevo" class="nav-link {% if request.path == '/nuevo' %}active{% endif %}">
                <i class="fa-solid fa-square-plus"></i> Nueva Incidencia
            </a>

            <div style="margin-top: auto;">
                <a href="/logout" class="nav-link nav-link-danger">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión
                </a>
            </div>
        </nav>

        <!-- CONTENIDO DINÁMICO (Aquí se inyectan las demás vistas) -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
