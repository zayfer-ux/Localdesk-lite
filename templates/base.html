<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalDesk - Soporte Técnico</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        :root {
            --sidebar-width: 260px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text-main);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--apple-surface);
            border-right: 1px solid var(--apple-border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 32px;
            padding-left: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--apple-text-main);
        }

        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-item {
            margin-bottom: 6px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--apple-text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            background-color: var(--apple-bg);
            color: var(--apple-accent);
        }

        .nav-link i {
            width: 20px;
            font-size: 1.1rem;
            color: var(--apple-text-secondary);
            text-align: center;
        }

        .nav-link:hover i {
            color: var(--apple-accent);
        }

        .main-content {
            flex-grow: 1;
            margin-left: var(--sidebar-width);
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div>
            <div class="brand">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 5v14h7 M5 19l7-7v-7 M12 5q8 0 8 7t-8 7" />
                </svg>
                LocalDesk
            </div>

            <ul class="nav-menu">
                <li class="nav-item"><a href="/" class="nav-link"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li class="nav-item"><a href="/areas" class="nav-link"><i class="fa-solid fa-layer-group"></i>
                        Departamentos</a></li>
                <li class="nav-item"><a href="/nuevo" class="nav-link"><i class="fa-solid fa-plus-circle"></i> Nuevo
                        Ticket</a></li>
                {% if session.get('rol') == 'Admin' or session.get('rol') == 'Administrador' %}
                <li class="nav-item"><a href="/tecnicos" class="nav-link"><i class="fa-solid fa-users-gear"></i> Gestión
                        Técnicos</a></li>
                {% endif %}
            </ul>
        </div>

        <div style="margin-top: auto; padding-top: 20px;">
            <p
                style="font-size: 0.9rem; color: var(--apple-text-secondary); margin-bottom: 12px; margin-left: 12px; font-weight: 600;">
                Others</p>
            <a href="/perfil" class="nav-link"><i class="fa-solid fa-gear"></i> Settings</a>
            <a href="/logout" class="nav-link"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>

            <div
                style="display: flex; align-items: center; gap: 12px; background-color: var(--apple-bg); padding: 12px; border-radius: 12px; margin-top: 16px; border: 1px solid var(--apple-border);">
                <img src="{{ session.get('foto') or 'https://ui-avatars.com/api/?name=' + session.get('nombre', 'U') + '&background=0071E3&color=fff' }}"
                    style="width: 42px; height: 42px; border-radius: 50%; object-fit: cover;">
                <div style="overflow: hidden;">
                    <p
                        style="margin: 0; font-size: 0.95rem; font-weight: 600; color: var(--apple-text-main); white-space: nowrap; text-overflow: ellipsis;">
                        {{ session.get('nombre') }}</p>
                    <p style="margin: 0; font-size: 0.8rem; color: var(--apple-text-secondary);">{{ session.get('rol')
                        }}</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
