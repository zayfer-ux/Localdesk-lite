<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalDesk - Soporte Técnico</title>

    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tu archivo CSS principal -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* Estructura del Menú Lateral (Sidebar) estilo Apple HIG */
        :root {
            --sidebar-width: 260px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text-main);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--apple-surface);
            border-right: 1px solid var(--apple-border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 32px;
            padding-left: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--apple-text-main);
        }

        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        .nav-item {
            margin-bottom: 6px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--apple-text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            background-color: var(--apple-bg);
            color: var(--apple-accent);
        }

        .nav-link i {
            width: 24px;
            font-size: 1.1rem;
            color: var(--apple-text-secondary);
            transition: color 0.2s ease;
        }

        .nav-link:hover i {
            color: var(--apple-accent);
        }

        .logout-btn {
            margin-top: auto;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--apple-red);
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background-color: rgba(255, 59, 48, 0.1);
        }

        /* Contenedor del contenido dinámico */
        .main-content {
            flex-grow: 1;
            margin-left: var(--sidebar-width);
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <!-- MENÚ LATERAL (SIDEBAR) -->
    <aside class="sidebar">
        <!-- Logo Vectorial -->
        <div class="brand">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 5v14h7 M5 19l7-7v-7 M12 5q8 0 8 7t-8 7" />
            </svg>
            LocalDesk
        </div>

        <!-- Enlaces de Navegación -->
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="/" class="nav-link">
                    <i class="fa-solid fa-house"></i> Dashboard
                </a>
            </li>

            <!-- EL NUEVO BOTÓN DE DEPARTAMENTOS -->
            <li class="nav-item">
                <a href="/areas" class="nav-link">
                    <i class="fa-solid fa-layer-group"></i> Departamentos
                </a>
            </li>

            <li class="nav-item">
                <a href="/nuevo" class="nav-link">
                    <i class="fa-solid fa-plus-circle"></i> Nuevo Ticket
                </a>
            </li>
        </ul>

        <!-- Botón de Salida -->
        <a href="/logout" class="logout-btn">
            <i class="fa-solid fa-arrow-right-from-bracket" style="margin-right: 10px;"></i> Cerrar Sesión
        </a>
    </aside>

    <!-- AQUÍ SE INYECTAN LAS DEMÁS PANTALLAS (index, detalle, areas, etc.) -->
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
